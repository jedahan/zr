[package]
name = "zr"
edition = "2024"
version = "2.0.0"
authors = ["Jonathan Dahan <hi@jonathan.is>"]
description = "quick, simple zsh package manager"
readme = "readme.md"
keywords = ["zsh", "package", "manager", "cli"]
license = "MPL-2.0"
repository = "https://github.com/jedahan/zr.git"

[dependencies]
directories = "6.0.0"
git2 = "0.20.4"
git2_credentials = "0.15.0"
url = "2.5.8"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
